<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 620px; overflow: hidden; }
  body { background: #f4f1ea; font-family: -apple-system, "Helvetica Neue", sans-serif; color: #1f1d1a; }
  header { height: 84px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2ddd2; }
  .logo { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: #d9622b; }
  nav { font-size: 17px; color: #6d675d; display: flex; gap: 32px; }
  main { position: absolute; left: 64px; top: 128px; width: 1072px; display: flex; gap: 48px; }
  .lines { flex: 1; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 26px; }
  .line { display: flex; align-items: center; height: 96px; border-bottom: 1px solid #e2ddd2; font-size: 19px; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; margin-right: 22px; }
  .name { flex: 1; font-weight: 600; }
  .qty { width: 80px; color: #6d675d; }
  .price { width: 96px; text-align: right; font-weight: 600; }
  aside { width: 360px; height: 430px; background: #fff; border-radius: 18px; padding: 32px; box-shadow: 0 8px 30px rgba(60, 50, 30, 0.08); }
  aside h2 { font-size: 22px; margin-bottom: 22px; }
  .row { display: flex; justify-content: space-between; font-size: 18px; color: #4b463e; margin-bottom: 16px; }
  .code { display: inline-block; font-size: 13px; font-weight: 700; color: #2f7a3e; background: #e3f2e1; border-radius: 6px; padding: 3px 8px; margin-left: 8px; }
  .total { border-top: 1px solid #e2ddd2; padding-top: 20px; margin-top: 8px; font-size: 24px; font-weight: 700; color: #1f1d1a; }
  button { margin-top: 26px; width: 100%; height: 56px; border: 0; border-radius: 14px; background: #1f1d1a; color: #fff; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <header><div class="logo">tiny<span>·</span>shop</div><nav><span>Shop</span><span>About</span><span>Cart (3)</span></nav></header>
  <main>
    <section class="lines">
      <h1>Your cart</h1>
      <div class="line"><div class="thumb" style="background:#d9622b"></div><div class="name">Enamel mug</div><div class="qty">× 2</div><div class="price">$24.00</div></div>
      <div class="line"><div class="thumb" style="background:#3f6e8c"></div><div class="name">Canvas tote</div><div class="qty">× 1</div><div class="price">$9.50</div></div>
      <div class="line"><div class="thumb" style="background:#e3b23c"></div><div class="name">Sticker pack</div><div class="qty">× 1</div><div class="price">$3.00</div></div>
    </section>
    <aside>
      <h2>Summary</h2>
      <div class="row"><span>Subtotal</span><span>$36.50</span></div>
      <div class="row"><span>Coupon<span class="code">SAVE10</span></span><span>−$3.65</span></div>
      <div class="row"><span>Shipping</span><span>$4.99</span></div>
      <div class="row total"><span>Total</span><span id="total">$NaN</span></div>
      <button>Check out</button>
    </aside>
  </main>
  <script>if (location.search.includes("fixed")) document.getElementById("total").textContent = "$37.84";</script>
</body>
</html>
